<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Daily Sip | Kitchen Display</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>


<body>


<div class="kitchen-container">


    <h1>☕ Daily Sip</h1>


    <p class="tagline">

        Kitchen Display System

    </p>


    <div class="kitchen-header">


        <h2>👨‍🍳 Active Orders</h2>


        <button
            class="refresh-kitchen"
            onclick="loadKitchenOrders()"
        >

            ↻ Refresh Orders

        </button>


    </div>


    <div
        id="kitchenOrders"
        class="kitchen-orders"
    >


        <p class="loading-message">

            Loading orders...

        </p>


    </div>


</div>



    <script src="{{ url_for('static', filename='js/kitchen.js') }}"></script>


</body>

</html>
