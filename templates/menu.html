<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daily Sip | Menu Management</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="container">

    <h1>🍽️ Menu Management</h1>

    <button class="back-dashboard-btn" onclick="location.href='/'">
    ← Back to Dashboard
</button>

    <br><br>

    <div class="menu-form">

        <h2>Add New Item</h2>

        <input
            type="text"
            id="menuName"
            placeholder="Item Name">

        <input
            type="number"
            id="menuPrice"
            placeholder="Price">

        <button id="addMenuItemBtn">
            ➕ Add Item
        </button>

    </div>

    <br>

    <h2>Current Menu</h2>

    <div id="menuList">

        <p>Loading menu...</p>

    </div>

</div>

<script src="{{ url_for('static', filename='js/menu.js') }}"></script>

</body>

</html>
