<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Daily Sip | New Order</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="order-container">

    <h1>☕ Daily Sip</h1>
    <p class="tagline">New Customer Order</p>

    <!-- Order Details -->

    <div class="order-info">

        <div>

            <label><strong>Order Type</strong></label><br><br>

            <input type="radio" name="orderType" value="Dine In" checked>
            Dine In

            &nbsp;&nbsp;&nbsp;

            <input type="radio" name="orderType" value="Take Away">
            Take Away

        </div>

        <div id="tableSection">

            <label><strong>Table Number</strong></label><br><br>

            <select id="tableNumber">

                <option>Table 1</option>
                <option>Table 2</option>
                <option>Table 3</option>
                <option>Table 4</option>
                <option>Table 5</option>
                <option>Table 6</option>
                <option>Table 7</option>
                <option>Table 8</option>
                <option>Table 9</option>
                <option>Table 10</option>

            </select>

        </div>

        <div id="tokenSection" style="display:none;">

            <label><strong>Token Number</strong></label><br><br>

            <h2 id="tokenNumber">#101</h2>

        </div>

    </div>

    <!-- Main Content -->

    <div class="main">

        <!-- Menu -->

        <div class="menu">

            <h2>🍽 Menu</h2>

            <button class="food-btn" data-name="Coffee" data-price="30">
                ☕ Coffee
                <span>₹30</span>
            </button>

            <button class="food-btn" data-name="Sandwich" data-price="80">
                🥪 Sandwich
                <span>₹80</span>
            </button>

            <button class="food-btn" data-name="Burger" data-price="120">
                🍔 Burger
                <span>₹120</span>
            </button>

            <button class="food-btn" data-name="French Fries" data-price="90">
                🍟 French Fries
                <span>₹90</span>
            </button>

            <button class="food-btn" data-name="Cold Coffee" data-price="70">
                🥤 Cold Coffee
                <span>₹70</span>
            </button>

            <button class="food-btn" data-name="Brownie" data-price="60">
                🍰 Brownie
                <span>₹60</span>
            </button>

        </div>

        <!-- Order -->

        <div class="cart">

            <h2>🛒 Current Order</h2>

            <div id="cartItems" class="cart-box">

                <p>No items added yet.</p>

            </div>

            <div class="bill-summary">

                <p>
                    <span>Subtotal</span>
                    <span id="subtotal">₹0</span>
                </p>

                <p>
                    <span>GST (5%)</span>
                    <span id="gst">₹0</span>
                </p>

                <hr>

                <h3>
                    Grand Total
                    <span id="grandTotal">₹0</span>
                </h3>

            </div>

            <button class="place-order">
                ✅ Place Order
            </button>

            <button class="clear-order">
                🗑 Clear Order
            </button>

        </div>

    </div>

</div>

<script src="{{ url_for('static', filename='js/order.js') }}"></script>

</body>

</html>
